name: Deploy test backend

on:
  push:
    branches: [test]
  workflow_dispatch:

concurrency:
  group: easenest-test-backend
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    environment: test
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify backend
        run: |
          chmod +x mvnw
          ./mvnw -B clean verify

      - name: Prepare release
        run: |
          mkdir -p release/backend/target release/deploy
          cp target/zhuxiang-service-0.0.1-SNAPSHOT.jar release/backend/target/
          cp Dockerfile .dockerignore release/backend/
          cp deploy/docker-compose.yml deploy/docker-compose.test.yml deploy/nginx.conf \
            deploy/backup-mysql.sh deploy/deploy-test.sh \
            deploy/easenest-backup.service deploy/easenest-backup.timer release/deploy/

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TEST_SERVER_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.TEST_SERVER_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload and deploy
        env:
          TEST_SERVER_HOST: ${{ secrets.TEST_SERVER_HOST }}
          TEST_SERVER_USER: ${{ secrets.TEST_SERVER_USER }}
        run: |
          remote_dir="/home/${TEST_SERVER_USER}/easenest-release-${GITHUB_SHA}"
          scp -r release "${TEST_SERVER_USER}@${TEST_SERVER_HOST}:${remote_dir}"
          ssh "${TEST_SERVER_USER}@${TEST_SERVER_HOST}" \
            "sudo bash '${remote_dir}/deploy/deploy-test.sh' '${remote_dir}'"
