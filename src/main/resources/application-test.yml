spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_COMMAND_TIMEOUT:2s}

app:
  message:
    realtime:
      enabled: ${MESSAGE_SSE_ENABLED:true}
      broker: redis
  auth:
    sms:
      # 测试环境走真实 Redis 限流并禁用固定验证码，与生产一致；
      # 真实短信通道接入后 SMS_PROVIDER=aliyun 即在此环境验证。
      rate-limit-store: redis
      fixed-code: ""
      expose-code: false

alipay:
  # 测试环境使用沙箱网关验证完整的支付调用链路，生产凭证与正式网关由 prod profile 强制。
  gateway-url: ${ALIPAY_GATEWAY_URL:https://openapi-sandbox.dl.alipaydev.com/gateway.do}
  app-id: ${ALIPAY_APP_ID:}
  merchant-private-key: ${ALIPAY_MERCHANT_PRIVATE_KEY:}
  alipay-public-key: ${ALIPAY_ALIPAY_PUBLIC_KEY:}
  notify-url: ${ALIPAY_NOTIFY_URL:}
  return-url: ${ALIPAY_RETURN_URL:}
  pay-type: ${ALIPAY_PAY_TYPE:h5}
  # 测试环境同样硬关闭模拟支付，避免带着 mock 逻辑验证真实链路。
  mock-enabled: false
