server {
    listen 80;
    listen [::]:80;
    server_name kingwangf.fun www.kingwangf.fun;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name kingwangf.fun www.kingwangf.fun;

    ssl_certificate /etc/letsencrypt/live/kingwangf.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kingwangf.fun/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 25m;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location = /api {
        return 308 /api/;
    }

    location = /api/ {
        default_type application/json;
        return 200 '{"code":200,"message":"勿忧管家后端服务运行正常","data":{"docs":"/api/swagger-ui/index.html"}}';
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
