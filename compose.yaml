services:
  redis:
    image: redis:7.4-alpine
    container_name: zhuxiang-redis
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  redis_data:
    name: zhuxiang_ease_nest_redis_data
