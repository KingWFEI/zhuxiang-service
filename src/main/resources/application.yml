spring:
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: zhuxiang-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/zhuxiang_app?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username:   ${DB_USERNAME:root}
    password: ${DB_PASSWORD:wf010931}
#    url: ${DB_URL:jdbc:mysql://10.143.183.205:3306/zhuxiang_app?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
#    username: ${DB_USERNAME:zhuxiang_app_user}
#    password: ${DB_PASSWORD:Zhuxiang@2026!}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: ${SERVER_PORT:8000}
  servlet:
    context-path: ${API_PREFIX:/api}

springdoc:
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    display-request-duration: true
    operations-sorter: method
    tags-sorter: alpha
  packages-to-scan: com.zhuxiang.service.controller
  writer-with-order-by-keys: true

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.zhuxiang.service.entity
  type-enums-package: com.zhuxiang.service.immersive.enums
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id

app:
  auth:
    access-token-seconds: ${ACCESS_TOKEN_SECONDS:86400}
    refresh-token-days: ${REFRESH_TOKEN_DAYS:30}
    token-secret: ${TOKEN_SECRET:change-this-secret-in-production}
    fixed-sms-code: ${FIXED_SMS_CODE:123456}
  upload:
    directory: ${UPLOAD_DIRECTORY:./uploads}
  storage:
    type: ${STORAGE_TYPE:cos}
    cos:
      secret-id: ${TENCENT_COS_SECRET_ID:}
      secret-key: ${TENCENT_COS_SECRET_KEY:}
      session-token: ${TENCENT_COS_SESSION_TOKEN:}
      region: ${TENCENT_COS_REGION:}
      bucket: ${TENCENT_COS_BUCKET:}
      public-base-url: ${TENCENT_COS_PUBLIC_BASE_URL:}
      key-prefix: ${TENCENT_COS_KEY_PREFIX:zhuxiang}
  lock-passcode:
    encryption-key: ${LOCK_PASSCODE_ENCRYPTION_KEY:}
    key-version: ${LOCK_PASSCODE_KEY_VERSION:1}
    query-limit-per-minute: ${LOCK_PASSCODE_QUERY_LIMIT_PER_MINUTE:10}
    expiration-scan-ms: ${LOCK_PASSCODE_EXPIRATION_SCAN_MS:300000}
  lease:
    expiration-scan-ms: ${LEASE_EXPIRATION_SCAN_MS:300000}
  agent:
    base-url: ${AGENT_BASE_URL:http://localhost:8101}
    api-key: ${AGENT_API_KEY:change-this-agent-api-key}
  auto-unlock:
    enabled: ${AUTO_UNLOCK_ENABLED:true}
#    信号强度阈值
    min-rssi: ${AUTO_UNLOCK_MIN_RSSI:-55}
#    稳定时间 不再使用
    stable-millis: ${AUTO_UNLOCK_STABLE_MILLIS:2000}
#    冷却时间 秒
    cooldown-seconds: ${AUTO_UNLOCK_COOLDOWN_SECONDS:120}
  super-admin:
    enabled: ${SUPER_ADMIN_ENABLED:true}
    phone: ${SUPER_ADMIN_PHONE:13800000000}
    password: ${SUPER_ADMIN_PASSWORD:admin123}
    nickname: ${SUPER_ADMIN_NICKNAME:超级管理员}

alipay:
  gateway-url: ${ALIPAY_GATEWAY_URL:https://openapi-sandbox.dl.alipaydev.com/gateway.do}
  app-id: ${ALIPAY_APP_ID:}
  merchant-private-key: ${ALIPAY_MERCHANT_PRIVATE_KEY:}
  alipay-public-key: ${ALIPAY_ALIPAY_PUBLIC_KEY:}
  notify-url: ${ALIPAY_NOTIFY_URL:http://localhost:8000/api/payments/alipay/notify}
  return-url: ${ALIPAY_RETURN_URL:http://localhost/zhuxiang-payment-done}

amap:
  key: ${AMAP_KEY:34467f081797ade37c2eb007a8d0dbdc}

ttlock:
  client-id: ${TTLOCK_CLIENT_ID:cb5534587e624eb59a9244cc14b8e281}
  client-secret: ${TTLOCK_CLIENT_SECRET:b73051c1d61c6c3aa7a5bb4917a495e8}
  username: ${TTLOCK_USERNAME:15282398801}
  password: ${TTLOCK_PASSWORD:wf010931}
  access-token: ${TTLOCK_ACCESS_TOKEN:}
  base-url: ${TTLOCK_BASE_URL:https://api.sciener.com}

# ========== e签宝人脸认证 ==========
esign:
  enabled: true
  base-url: ${ESIGN_HOST:https://smlopenapi.esign.cn}
  app-id: ${ESIGN_APP_ID:}
  app-secret: ${ESIGN_APP_SECRET:}
  doc-template-id: ${ESIGN_DOC_TEMPLATE_ID:170ea88a36d442a5ad4c46001a0623a9}
  auto-finish: true
  sign-order-mode: SIMULTANEOUS
  notify-url: ${ESIGN_NOTIFY_URL:}
  redirect-url: ${ESIGN_REDIRECT_URL:}
  face:
    host: ${ESIGN_FACE_HOST:https://smlopenapi.esign.cn}
    app-id: ${ESIGN_FACE_APP_ID:}
    app-secret: ${ESIGN_FACE_APP_SECRET:}
    mode: ${ESIGN_FACE_MODE:ESIGN}
    callback-url: ${ESIGN_FACE_CALLBACK_URL:}

# ========== 安全加密 ==========
security:
  real-name:
    id-card-key: ${REAL_NAME_ID_CARD_KEY:}

# ========== 沉浸式看房 ==========
features:
  immersive-tour:
    enabled: ${FEATURE_IMMERSIVE_TOUR_ENABLED:true}
